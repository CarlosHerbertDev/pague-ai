services:

  php:
    build:
      context: .
      target: dev
    container_name: pague-ai-backend
    volumes:
      - ./src:/var/www/html
    ports:
      - "8099:80"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: mysql_pague-ai_backend
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pague-ai
      MYSQL_USER: pague-ai
      MYSQL_PASSWORD: 123
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_pague-ai_backend
    environment:
      PMA_HOST: db
    ports:
      - "8098:80"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.32
    container_name: mailpit_pague-ai_backend
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "8097:8025"
      - "1025:1025"

volumes:
  mysql_data:
  mailpit_data:
